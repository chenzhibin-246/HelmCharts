{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "redis.secretName" . }}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ default (randAlphaNum 32) .Values.auth.password | quote }}
{{- end }}
{{- end }}
