apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis.headlessServiceName" . }}
  replicas: {{ .Values.primary.replicaCount }}
  podManagementPolicy: {{ .Values.primary.podManagementPolicy }}
  selector:
    matchLabels:
      {{- include "redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redis.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.primary.podSecurityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.primary.podSecurityContext.fsGroup }}
        fsGroupChangePolicy: {{ .Values.primary.podSecurityContext.fsGroupChangePolicy }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "redis.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.primary.containerSecurityContext.enabled }}
          securityContext:
            {{- include "redis.containerSecurityContext" . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              exec redis-server /usr/local/etc/redis/redis.conf
              {{- if .Values.auth.enabled }} --requirepass "$REDIS_PASSWORD"{{- end }}
          env:
            {{- if .Values.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redis.secretName" . }}
                  key: {{ if .Values.auth.existingSecret }}{{ .Values.auth.existingSecretKey }}{{ else }}redis-password{{ end }}
            {{- end }}
            {{- with .Values.primary.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          {{- with .Values.primary.extraEnvFrom }}
          envFrom: {{ toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: redis
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.primary.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "{{ if .Values.auth.enabled }}redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping{{ else }}redis-cli ping{{ end }}"]
            initialDelaySeconds: {{ .Values.primary.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.primary.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.primary.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.primary.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.primary.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "{{ if .Values.auth.enabled }}redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping{{ else }}redis-cli ping{{ end }}"]
            initialDelaySeconds: {{ .Values.primary.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.primary.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.primary.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.primary.livenessProbe.failureThreshold }}
          {{- end }}
          resources: {{ toYaml .Values.primary.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            {{- with .Values.primary.extraVolumeMounts }}{{ toYaml . | nindent 12 }}{{- end }}
      {{- with .Values.primary.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.primary.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.primary.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "redis.fullname" . }}
        {{- with .Values.primary.extraVolumes }}{{ toYaml . | nindent 8 }}{{- end }}
  {{- if .Values.primary.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "redis.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: {{ toYaml .Values.primary.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.primary.persistence.size }}
        {{- if .Values.primary.persistence.storageClass }}
        storageClassName: {{ .Values.primary.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
