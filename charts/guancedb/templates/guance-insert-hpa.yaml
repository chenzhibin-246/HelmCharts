{{- if .Values.guance_insert.horizontalPodAutoscaler.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    {{- include "guancedb.guance_insert.labels" . | nindent 4 }}
{{- with .Values.guance_insert.extraLabels }}
{{ toYaml . | indent 4 }}
{{- end }}
  name: {{ template "guancedb.guance_insert.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  maxReplicas: {{ .Values.guance_insert.horizontalPodAutoscaler.maxReplicas }}
  minReplicas: {{ .Values.guance_insert.horizontalPodAutoscaler.minReplicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ template "guancedb.guance_insert.fullname" . }}
  metrics:
{{ toYaml .Values.guance_insert.horizontalPodAutoscaler.metrics | indent 4 }}
{{- end -}}
