{{/* 为需要 Kubernetes API 访问的 GuanceDB 组件创建 RBAC Role。 */}}
{{- if .Values.guance_throttler.enabled }}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ template "guancedb.fullname" . }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guancedb.common.metaLabels" . | nindent 4 }}
  {{- if .Values.rbac.extraLabels }}
{{ toYaml .Values.rbac.extraLabels | indent 4}}
  {{- end }}
{{- with .Values.rbac.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
rules:
  - apiGroups: [ "" ]
    resources:
      - pods
    verbs: [ "get", "list", "watch" ]
{{- end }}
