{{/* guance-select 的无头 Service，供查询客户端和组件发现。 */}}
{{- if .Values.guance_select.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
{{- if .Values.guance_select.service.annotations }}
{{ toYaml .Values.guance_select.service.annotations | indent 4}}
{{- end }}
{{- if not .Values.useDeprecatedDatakitAnnotation }}
{{- include "guancedb.datakitAnnotations" "8481" | nindent 4 }}
{{- end }}
  labels:
    {{- include "guancedb.guance_select.labels" . | nindent 4 }}
{{- if .Values.guance_select.service.labels }}
{{ toYaml .Values.guance_select.service.labels | indent 4}}
{{- end }}
  name: {{ template "guancedb.guance_select.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: {{ .Values.guance_select.service.clusterIP }}
{{- if .Values.guance_select.service.externalIPs }}
  externalIPs:
{{ toYaml .Values.guance_select.service.externalIPs | indent 4 }}
{{- end }}
{{- if .Values.guance_select.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.guance_select.service.loadBalancerIP }}
{{- end }}
{{- if .Values.guance_select.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
  {{- range $cidr := .Values.guance_select.service.loadBalancerSourceRanges }}
    - {{ $cidr }}
  {{- end }}
{{- end }}
  ports:
    - name: http
      port: {{ .Values.guance_select.service.servicePort }}
      protocol: TCP
      targetPort: {{ .Values.guance_select.service.targetPort }}
      {{ with .Values.guance_select.service.nodePort }}
      nodePort: {{ . }}
      {{ end }}
  {{- range .Values.guance_select.service.extraPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      protocol: TCP
      targetPort: {{ .targetPort }}
  {{- end }}
  selector:
    {{- include "guancedb.guance_select.matchLabels" . | nindent 4 }}
  type: "{{ .Values.guance_select.service.type }}"
{{- end }}
