{{- if .Values.doris.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "guancedb.fullname" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  dorisRootPassword: "{{ .Values.doris.rootPassword }}"
  dorisUserReadPassword: "{{ .Values.doris.userReadPassword }}"
{{- end }}
