{{/* 保护 guance-insert 在节点维护或驱逐期间的最小可用副本数。 */}}
{{- if .Values.guance_insert.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ template "guancedb.guance_insert.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guancedb.guance_insert.labels" . | nindent 4 }}
  {{- with .Values.guance_insert.podDisruptionBudget.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if .Values.guance_insert.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.guance_insert.podDisruptionBudget.minAvailable }}
{{- end }}
{{- if .Values.guance_insert.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.guance_insert.podDisruptionBudget.maxUnavailable }}
{{- end }}
  selector:
    matchLabels:
      {{- include "guancedb.guance_insert.matchLabels" . | nindent 6 }}
{{- end }}
