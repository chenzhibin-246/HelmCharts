{{/* 为 Prometheus Operator 创建 guance-select 的 ServiceMonitor。 */}}
{{- if and .Values.guance_select.enabled .Values.guance_select.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  {{- if .Values.guance_select.serviceMonitor.annotations }}
  annotations:
{{ toYaml .Values.guance_select.serviceMonitor.annotations | indent 4 }}
  {{- end }}
  labels:
  {{- include "guancedb.guance_select.labels" . | nindent 4 }}
  {{- if .Values.guance_select.serviceMonitor.extraLabels }}
{{ toYaml .Values.guance_select.serviceMonitor.extraLabels | indent 4 }}
  {{- end }}
  name: {{ template "guancedb.guance_select.fullname" . }}
  {{- if .Values.guance_select.serviceMonitor.namespace }}
  namespace: {{ .Values.guance_select.serviceMonitor.namespace }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "guancedb.guance_select.matchLabels" . | nindent 6 }}
  endpoints:
    - port: http
      {{- if .Values.guance_select.serviceMonitor.scheme }}
      scheme: {{ .Values.guance_select.serviceMonitor.scheme }}
      {{- end }}
      {{- if .Values.guance_select.serviceMonitor.interval }}
      interval: {{ .Values.guance_select.serviceMonitor.interval }}
      {{- end }}
      {{- if .Values.guance_select.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.guance_select.serviceMonitor.scrapeTimeout }}
      {{- end }}
      {{- with .Values.guance_select.serviceMonitor.tlsConfig }}
      tlsConfig:
          {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.guance_select.serviceMonitor.relabelings }}
      relabelings:
          {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
