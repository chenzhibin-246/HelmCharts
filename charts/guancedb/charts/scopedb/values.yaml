# ScopeDB 子 Chart 的全局配置。父 Chart 可以通过 scopedb.global 覆盖这些值。
global: { }

# ScopeDB 使用的 S3 兼容对象存储。endpoint、bucket 和凭据需要匹配实际环境。
s3:
  endpoint: http://minio-server:9000
  virtualHostStyle: false
  region: us-east-1
  bucket: scopedb

scopeql:
  # 是否部署 ScopeQL 查询服务。
  enabled: false
  image:
    repository: pubrepo.guance.com/scopedb/scopeql
    tag: v0.6.0

# ScopeDB 工作节点组。每个节点组会生成独立的 workload 和 Service。
# name 决定查询、写入、后台作业等职责，resources 影响并发和调度。
nodegroups:
  - { name: query0,        resources: { limits: { cpu: "4", memory: "8Gi" }, requests: { cpu: "1", memory: "2Gi" } } }
  - { name: query1,        resources: { limits: { cpu: "4", memory: "8Gi" }, requests: { cpu: "1", memory: "2Gi" } }, otlpHost: 172.16.242.2 }
  # disk cache 使用节点的本地磁盘缓存数据和索引，减少查询时重复访问对象存储的开销。
  - { name: large-query,   resources: { limits: { cpu: "4", memory: "8Gi" }, requests: { cpu: "1", memory: "2Gi" } }, diskCache: { enabled: true, diskBudgetGi: 2 } }
  - { name: system-query,  resources: { limits: { cpu: "4", memory: "8Gi" }, requests: { cpu: "1", memory: "2Gi" } } }
  - { name: job,           resources: { limits: { cpu: "8", memory: "16Gi" }, requests: { cpu: "1", memory: "2Gi" } } }
  - { name: rollover-job,  resources: { limits: { cpu: "4", memory: "8Gi" }, requests: { cpu: "1", memory: "2Gi" } } }
  - { name: ingest,        resources: { limits: { cpu: "4", memory: "8Gi" }, requests: { cpu: "1", memory: "2Gi" } }, autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 2, targetCPUUtilizationPercentage: 60 } }

# ScopeDB 元数据升级 Job 的行为。
metaUpgrade:
  disable: false
  offline: false
# 是否允许 ScopeDB 容器生成 core dump。
enableCoreDump: false

# ScopeDB workload 的更新策略。
strategy:
  type: RollingUpdate

# ScopeDB 主容器镜像。
image:
  repository: pubrepo.guance.com/scopedb/scopedb
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# 私有镜像仓库认证 Secret。
imagePullSecrets: [ ]
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: { }
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: { }

podSecurityContext: { }
# fsGroup: 2000

securityContext: { }
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  clusterIP: None
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 6543

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: { }
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: [ ]
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/

# Additional volumes on the output Deployment definition.
volumes: [ ]
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: [ ]
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: { }

tolerations: [ ]

affinity: { }
