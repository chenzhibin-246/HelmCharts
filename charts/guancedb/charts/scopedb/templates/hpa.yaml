{{ range .Values.nodegroups }}
{{- if and .autoscaling .autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "scopedb.fullname" $ }}-{{ .name }}
  labels:
    {{- include "scopedb.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ include "scopedb.fullname" $ }}-{{ .name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "scopedb.fullname" $ }}-{{ .name }}
  minReplicas: {{ .autoscaling.minReplicas }}
  maxReplicas: {{ .autoscaling.maxReplicas }}
  behavior:
    {{- with .autoscaling.behavior -}}
      {{ toYaml . | nindent 4 }}
    {{- end }}
  metrics:
    {{- if or .autoscaling.targetCpuUtilizationPercentage .autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ or .autoscaling.targetCpuUtilizationPercentage .autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
---
{{- end }}
{{- end }}
