# Secret 名称应与 ScopeDB 的实际 fullname 一致，例如将 scopedb.fullnameOverride 设为 scopedb-logs。
# 应用前取消下方 stringData 整段的注释，并替换占位符。
# PostgreSQL 密码放入连接串前需进行 URL 编码，sslmode 按数据库配置填写。
apiVersion: v1
kind: Secret
metadata:
  name: scopedb-logs
  namespace: guancedb
type: Opaque
# stringData:
#   SERVER_META_SERVICE_URL: "postgresql://scopedb:<URL_ENCODED_SCOPEDB_DB_PASSWORD>@<POSTGRESQL_HOST>:5432/scopedb_meta?sslmode=<POSTGRESQL_SSLMODE>"
#   SERVER_DEFAULT_STORAGE_ACCESS_KEY_ID: "<S3_ACCESS_KEY_ID>"
#   SERVER_DEFAULT_STORAGE_SECRET_ACCESS_KEY: "<S3_SECRET_ACCESS_KEY>"
