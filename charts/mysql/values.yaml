nameOverride: ""
fullnameOverride: ""

image:
  registry: docker.io
  repository: library/mysql
  tag: "8.4.13"
  pullPolicy: IfNotPresent
  pullSecrets: []

auth:
  rootPassword: ""
  username: ""
  password: ""
  database: ""
  existingSecret: ""
  existingSecretKeys:
    rootPassword: mysql-root-password
    password: mysql-password

tls:
  enabled: true
  requireSecureTransport: true
  existingSecret: ""
  autoGenerated: true
  secretName: ""
  certFilename: tls.crt
  keyFilename: tls.key
  caFilename: ca.crt

mysql:
  configuration: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_0900_ai_ci
    skip-name-resolve
    mysqlx=0
    [client]
    default-character-set=utf8mb4

initdbScripts: {}

service:
  type: ClusterIP
  port: 3306
  annotations: {}
  sessionAffinity: None

primary:
  replicaCount: 1
  podManagementPolicy: OrderedReady
  podSecurityContext:
    enabled: true
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    enabled: true
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 768Mi
  startupProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 30
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    annotations: {}
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

networkPolicy:
  enabled: false
  allowExternal: true

commonLabels: {}
commonAnnotations: {}
