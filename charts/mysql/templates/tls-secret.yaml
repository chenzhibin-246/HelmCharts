{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) (not (lookup "v1" "Secret" .Release.Namespace (include "mysql.tlsSecretName" .))) }}
{{- if not .Values.tls.autoGenerated }}
{{- fail "tls.autoGenerated must be true when tls.existingSecret is empty" }}
{{- end }}
{{- $ca := genCA (printf "%s-ca" (include "mysql.fullname" .)) 3650 -}}
{{- $names := include "mysql.tlsDnsNames" . | fromYamlArray -}}
{{- $cert := genSignedCert (include "mysql.serviceName" .) (list "127.0.0.1") $names 365 $ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mysql.tlsSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{ .Values.tls.certFilename }}: {{ $cert.Cert | b64enc | quote }}
  {{ .Values.tls.keyFilename }}: {{ $cert.Key | b64enc | quote }}
  {{ .Values.tls.caFilename }}: {{ $ca.Cert | b64enc | quote }}
{{- end }}
