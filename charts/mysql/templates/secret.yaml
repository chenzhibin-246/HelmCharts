{{- if not .Values.auth.existingSecret }}
{{- $name := include "mysql.secretName" . -}}
{{- $current := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if not $current }}
{{- $root := default (randAlphaNum 32) .Values.auth.rootPassword -}}
{{- $password := default (randAlphaNum 32) .Values.auth.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  mysql-root-password: {{ $root | quote }}
  mysql-password: {{ $password | quote }}
{{- end }}
{{- end }}
