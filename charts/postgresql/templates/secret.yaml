{{- if not .Values.auth.existingSecret }}
{{- $name := include "postgresql.secretName" . }}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ default (randAlphaNum 32) .Values.auth.postgresPassword | quote }}
  {{- if .Values.auth.username }}
  password: {{ default (randAlphaNum 32) .Values.auth.password | quote }}
  {{- end }}
{{- end }}
{{- end }}
